
name: Azure Infrastructure Deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose what Terraform should do"
        required: true
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: production

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Terraform
        run: terraform -chdir=infra init -input=false

      - name: Validate Terraform
        run: terraform -chdir=infra validate

      - name: Terraform Plan
        if: inputs.action == 'apply'
        run: terraform -chdir=infra plan -input=false -out=tfplan

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform -chdir=infra apply -input=false -auto-approve tfplan

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: terraform -chdir=infra destroy -input=false -auto-approve
