name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Run tests
        run: python -m pytest -v

  security-checks:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run security hooks
        run: pre-commit run --all-files

  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive bootstrap infra

      - name: Initialize bootstrap
        run: terraform -chdir=bootstrap init -backend=false -input=false -lockfile=readonly

      - name: Validate bootstrap
        run: terraform -chdir=bootstrap validate

      - name: Initialize infrastructure
        run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly

      - name: Validate infrastructure
        run: terraform -chdir=infra validate
