version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "azure-functions"
        versions: [">=2.0.0"]

  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/bootstrap"
    schedule:
      interval: "weekly"